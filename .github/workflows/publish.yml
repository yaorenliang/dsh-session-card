name: Publish

# A tag is the whole release. This workflow does three things with it, and each
# one is idempotent, so re-running an old tag only repairs what is missing —
# that is the documented way to recover a tag whose first run died halfway.
#
#   1. create the GitHub Release, with the notes already written in CHANGELOG.md
#   2. attach the packed tarball to it, which is what a storefront offers to
#      someone who would rather not build from source
#   3. publish to npm, if npm trusts this repository
#
# Step 3 is the only one that needs a credential: npm trusted publishing mints a
# token from the OIDC identity below, and nothing is stored. It works only where
# npm has been told which repository and which filename may publish this package;
# anywhere else it ends in ENEEDAUTH, and the release above stands on its own.
on:
  release:
    types: [published]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release again, e.g. v0.1.3
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    env:
      # A dispatch runs on main's copy of this file for the tag it is given.
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Trusted publishing needs npm 11.5 or newer.
      - run: npm install --global npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      # The notes are already in CHANGELOG.md; a generated compare link is not a
      # description of what changed. The extraction is a script because bash
      # quotes an inline `node -e` argument before node sees it: the character
      # class in the old inline version expanded to a bad substitution, the step
      # exited 1, and the publish below was skipped on every tag that went
      # through it.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
            exit 0
          fi
          notes=$(mktemp)
          node scripts/release-notes.mjs "$TAG" > "$notes"
          if [ -s "$notes" ]; then
            gh release create "$TAG" --title "$TAG" --notes-file "$notes"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
      # A prebuilt tarball is how someone installs this without the build step,
      # and it is what a storefront offers when npm is not an option.
      #
      # Two names, one file. The versioned name is the honest one to download.
      # The version-free name exists so that a storefront can link
      # `releases/latest/download/dsh-session-card.tgz` and keep working after
      # the next release: `latest` is resolved when the link is clicked, but the
      # filename in it is taken literally, so a versioned name there would resolve
      # to a file the newer release does not have and 404 — quietly, months later.
      - name: Attach the tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pnpm pack --pack-destination dist
          cp dist/*.tgz dist/dsh-session-card.tgz
          gh release upload "$TAG" dist/*.tgz --clobber
      # Publishing twice for one version is the one mistake that cannot be taken
      # back, so the registry itself decides whether this run publishes.
      - name: Publish to npm
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@yaorenliang/dsh-session-card@$version" version >/dev/null 2>&1; then
            echo "@yaorenliang/dsh-session-card@$version is already published; nothing to do"
            exit 0
          fi
          log=$(mktemp)
          # ENEEDAUTH is the state of the settings page, not a defect in this
          # commit: npm has not been told that this repository may publish, and
          # the release above is already complete without it. Everything else is
          # a real failure and stays red.
          if npm publish --access public >"$log" 2>&1; then
            cat "$log"
            exit 0
          fi
          cat "$log"
          if grep -q ENEEDAUTH "$log"; then
            echo "::warning::npm has not been told to trust this repository, so nothing was published. Add a trusted publisher for yaorenliang/dsh-session-card, workflow publish.yml, at https://www.npmjs.com/package/@yaorenliang/dsh-session-card/access — the next tag then publishes with no stored secret."
            exit 0
          fi
          exit 1