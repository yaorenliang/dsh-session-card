name: Publish

# Trusted publishing: npm trusts this repository and this filename, and the token
# is minted per run from the OIDC identity. No secret is stored anywhere.
#
# A tag push needs no browser and no personal token: the same job creates the
# release for that tag and publishes the package.
#
# Every step is idempotent, so re-running on an old tag only repairs what is
# missing. Re-running is the documented way to recover a tag whose first run
# died before the registry accepted the tarball.
on:
  release:
    types: [published]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Trusted publishing needs npm 11.5 or newer.
      - run: npm install --global npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      # The notes are already written in CHANGELOG.md; a generated compare link
      # is not a description of what changed. The extraction is a script because
      # bash quotes a `node -e` argument before node sees it: the character class
      # in the old inline version expanded to a bad substitution, and the failure
      # skipped the publish step below on every tag that went through it.
      - name: Release this tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            exit 0
          fi
          notes=$(mktemp)
          node scripts/release-notes.mjs "$tag" > "$notes"
          if [ -s "$notes" ]; then
            gh release create "$tag" --title "$tag" --notes-file "$notes"
          else
            gh release create "$tag" --title "$tag" --generate-notes
          fi
      # Publishing twice for one version is the one mistake that cannot be taken
      # back, so the registry itself decides whether this run publishes.
      - name: Publish to npm
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@yaorenliang/dsh-session-card@$version" version >/dev/null 2>&1; then
            echo "@yaorenliang/dsh-session-card@$version is already published; nothing to do"
            exit 0
          fi
          npm publish --access public
